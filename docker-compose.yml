services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
      LEDGER_HMAC_KEY: ${LEDGER_HMAC_KEY:-dev-only-change-me-please-32b}
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  settler:
    build:
      context: .
      target: settler
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
      LEDGER_HMAC_KEY: ${LEDGER_HMAC_KEY:-dev-only-change-me-please-32b}
      LEDGER_FEED_FILE: /feed/events.jsonl
    volumes:
      - ./feed:/feed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["-watch", "-file", "/feed/events.jsonl"]

volumes:
  pgdata:
